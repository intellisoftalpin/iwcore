name: Release gate

# The checks that are too slow for every push: API compatibility, strict docs,
# packaging, fuzzing of every untrusted parser, and mutation testing of the
# security-relevant modules. Runs on pull requests to main and on demand.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 0' # Sunday 01:00 UTC: full mutation run on main
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# actions: write lets a failing job cancel the rest of the run.
permissions:
  contents: read
  actions: write

jobs:
  semver:
    name: API compatibility (cargo semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check against the latest release on crates.io
        uses: obi1kenobi/cargo-semver-checks-action@v2
      # In 0.x a minor bump may break the API, so the check above accepts every
      # change. Evaluating as a patch-level (non-breaking) release lists each
      # breaking change for the CHANGELOG; informational, never fails the gate.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: List breaking changes for the CHANGELOG
        continue-on-error: true
        run: |
          set -o pipefail
          cargo semver-checks check-release --release-type minor 2>&1 | tee semver.txt || true
          { echo '### Breaking changes against the last release'; echo '```'; cat semver.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The first failing job stops the whole run instead of waiting hours for
      # the other fuzz targets and mutation shards. Keep this step last.
      - name: Stop the whole run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  docs-and-package:
    name: Docs and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Docs without warnings
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package contents
        run: cargo package --list | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish dry run (nothing is published)
        run: cargo publish --dry-run

      # The first failing job stops the whole run instead of waiting hours for
      # the other fuzz targets and mutation shards. Keep this step last.
      - name: Stop the whole run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  fuzz:
    name: Fuzz ${{ matrix.target }} (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        target: [cxf_preview, passkey_request, passkey_record, assetlinks, journal, restore_inspect, autofill_index, legacy_decrypt, origin_check, cxf_import_apply]
        # libFuzzer caps inputs at 4 KiB by default; CXF payloads get room to
        # reach the per-value and per-item limits (64 KiB values, 1 MiB notes,
        # 64 credentials and 256 custom fields per item, 200 new labels).
        # Both start from the valid payloads in fuzz/seeds/cxf.
        include:
          - target: cxf_preview
            max_len: 1048576
            seeds: seeds/cxf
          - target: cxf_import_apply
            max_len: 1048576
            seeds: seeds/cxf
          # Room for a small wallet database, starting from fuzz/seeds/restore.
          - target: restore_inspect
            max_len: 65536
            seeds: seeds/restore
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a static musl binary and would otherwise
        # build the fuzzer for musl, where the sanitizers cannot run.
        # An input that runs for more than 10 s counts as a failure.
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            corpus/${{ matrix.target }} ${{ matrix.seeds }} \
            -- -max_total_time=1800 -timeout=10 -rss_limit_mb=2048 -max_len=${{ matrix.max_len || 4096 }}
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/

      # The first failing job stops the whole run instead of waiting hours for
      # the other fuzz targets and mutation shards. Keep this step last.
      - name: Stop the whole run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}

  mutants:
    # Pull requests mutate only the code they change; the weekly run and a
    # manual run mutate everything. Shards are sized for about 60 mutants
    # each (public repository: runners cost nothing, wall time does).
    name: Mutation testing (${{ matrix.area }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        include:
          - { area: cxf, shard: 0, shards: 8 }
          - { area: cxf, shard: 1, shards: 8 }
          - { area: cxf, shard: 2, shards: 8 }
          - { area: cxf, shard: 3, shards: 8 }
          - { area: cxf, shard: 4, shards: 8 }
          - { area: cxf, shard: 5, shards: 8 }
          - { area: cxf, shard: 6, shards: 8 }
          - { area: cxf, shard: 7, shards: 8 }
          - { area: passkey, shard: 0, shards: 5 }
          - { area: passkey, shard: 1, shards: 5 }
          - { area: passkey, shard: 2, shards: 5 }
          - { area: passkey, shard: 3, shards: 5 }
          - { area: passkey, shard: 4, shards: 5 }
          - { area: autofill, shard: 0, shards: 4 }
          - { area: autofill, shard: 1, shards: 4 }
          - { area: autofill, shard: 2, shards: 4 }
          - { area: autofill, shard: 3, shards: 4 }
          - { area: restore, shard: 0, shards: 1 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Changed code of this pull request
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}...HEAD" -- src > "$RUNNER_TEMP/pr.diff"
      - name: Mutate
        env:
          DIFF: ${{ github.event_name == 'pull_request' && format('{0}/pr.diff', runner.temp) || '' }}
        run: scripts/mutants.sh ${{ matrix.area }} ${{ matrix.shard }} ${{ matrix.shards }} ${DIFF:+"$DIFF"}
      - name: Missed mutants
        if: always()
        run: |
          {
            echo "### ${{ matrix.area }} ${{ matrix.shard }}/${{ matrix.shards }}"
            for f in caught missed timeout unviable; do
              echo "- $f: $(wc -l < mutants.out/$f.txt 2>/dev/null || echo 0)"
            done
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.area }}-${{ matrix.shard }}
          path: mutants.out/
      # The first failing job stops the whole run instead of waiting hours for
      # the other fuzz targets and mutation shards. Keep this step last.
      - name: Stop the whole run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
