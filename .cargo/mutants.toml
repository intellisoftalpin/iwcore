# cargo-mutants configuration for the release gate.
#
# Equivalent mutants: each change below behaves identically to the original
# for every possible input, so no test can catch it. They are named by
# file:line:column; when the code moves the pattern stops matching and the
# mutant shows up as missed again, so this list can never hide a real gap.

exclude_re = [
    # `starts_with('.') || ends_with('.')` -> `&&`: a name with a single leading
    # or trailing dot has an empty label, which the label loop refuses with the
    # same error.
    'src/passkey/record\.rs:441:72: replace \|\| with && in validate_rp_id',
    # `is_public_suffix(id) || domain_str(id).is_none()` -> `&&`: for a valid
    # rpId the two are always equal (the registrable domain is the suffix plus
    # one label, absent exactly when the name is its own suffix).
    'src/passkey/origin\.rs:60:58: replace \|\| with && in rp_id_valid_for_origin',
    # UP | BE | BS: three constants with no shared bits, so `|` and `^` agree.
    'src/passkey/webauthn\.rs:44:(25|35): replace \| with \^ in flags',
    # 0x40 | len for len <= 23: the bits never overlap.
    'src/passkey/webauthn\.rs:123:33: replace \| with \^ in push_cbor_bytes_header',
    # A bare relative path has the parent "": the temp file lands in the
    # current directory either way.
    'src/backup/restore\.rs:92:20: replace match guard',
    # Removing a stale parked sidecar: when that fails for any reason but
    # NotFound, the rename onto the same path fails as well, so the restore
    # stops with an error either way.
    'src/backup/restore\.rs:161:23: replace match guard',
    # The directory fsync after the rename only affects durability across a
    # power loss, which a test cannot observe.
    'src/backup/restore\.rs:193:5: replace sync_parent_dir with \(\)',
    # Wiping the export's field copies on drop. tests/wipe_on_drop.rs checks
    # RawRecord and SecretMap this way; the export is not covered there yet.
    'src/cxf/export\.rs:154:9: replace <impl Drop for WipedFields>::drop with \(\)',
    # `Ok(None)` and `Ok(Default::default())` are the same value for Option.
    'src/cxf/de\.rs:(139|148|160):9: replace <impl Visitor<.de> for LooseVisitor<T>>::visit_(bool|f64|unit)',
    # Reading passkey records of every item instead of only those in scope:
    # records out of scope are never looked up, so the document is the same.
    'src/cxf/export\.rs:57:75: replace && with \|\| in Wallet::export_cxf',
    # Compiled only under cfg(fuzzing); no test build contains it.
    'src/passkey/record\.rs:[0-9]+:[0-9]+: replace PasskeyRecord::fuzz_round_trip',
]
