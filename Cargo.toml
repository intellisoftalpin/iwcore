[package]
name = "iwcore"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/intellisoftalpin/iwcore"
homepage = "https://intelliwallet.io"
documentation = "https://docs.rs/iwcore"
authors = ["IntelliSoftAlpin"]
description = "IntelliWallet Core - Password manager library with authenticated encryption"
keywords = ["password-manager", "encryption", "argon2", "security", "vault"]
categories = ["cryptography", "database"]
readme = "README.md"
exclude = ["docs"]

[dependencies]
# Database
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Crypto - current scheme (XChaCha20-Poly1305 + Argon2id)
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
zeroize = "1.9.1"

# Crypto - legacy scheme (read-only, used by the v5->v6 migration path)
aes = "0.9.3"
cbc = "0.2.1"
md-5 = "0.11.0"
block-padding = "0.4.2"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
# Backups are only ever written with Deflate, so only Deflate is compiled in:
# the default features would pull in zstd, bzip2, lzma and xz for nothing.
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
# PDF export. Default features off: they add an HTML/CSS layout engine that the
# card layout in `export::pdf` does not need.
printpdf = { version = "0.12.8", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }
rand = "0.10.3"
tempfile = "3.27"

# Crypto - autofill write-back journal (P-256 ECDH + HKDF-SHA256), see
# `autofill::journal`. Chosen to match what Apple's CryptoKit exposes natively,
# so the iOS AutoFill extension needs no third-party or Rust crypto of its own.
p256 = { version = "0.14.0", features = ["ecdh"] }
hkdf = "0.13.0"
sha2 = "0.11.1"

[dev-dependencies]

[features]
default = []
